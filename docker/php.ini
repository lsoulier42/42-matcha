; Matcha — surcouche de configuration PHP (défauts sécurisés)
date.timezone = Europe/Paris

; Uploads d'images (max 5 photos, validation côté serveur en plus)
upload_max_filesize = 8M
post_max_size = 12M

; Sessions : cookie HttpOnly, strict, SameSite Lax
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 604800

; Affichage des erreurs piloté par APP_ENV dans le bootstrap
display_errors = 0
log_errors = 1
error_reporting = E_ALL
