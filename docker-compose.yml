# Matcha — environnement de développement : web + base + mail catcher
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # Fuseau aligné sur PHP (date.timezone = Europe/Paris) : NOW() cohérent.
      TZ: Europe/Paris
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_dev_pw}
      MYSQL_DATABASE: ${DB_NAME:-matcha}
      MYSQL_USER: ${DB_USER:-matcha}
      MYSQL_PASSWORD: ${DB_PASS:-matcha_dev_pw}
    volumes:
      - db-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      - .:/var/www/html
    # Le dossier d'uploads (bind mount) doit être inscriptible par Apache (www-data).
    command: sh -c "chown -R www-data:www-data /var/www/html/public/assets/uploads && apache2-foreground"
    depends_on:
      db:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
    ports:
      - "8026:8025"   # interface web MailHog
      - "1026:1025"   # SMTP (utilisé par le MailService maison)

volumes:
  db-data:
